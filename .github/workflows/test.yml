name: test

# Small on purpose. The suite is the foundation the rewrite stands on, not a
# census: three of its four files need no database at all, because the
# per-document check and the wire codec are pure. The fourth drives a real
# `mongod` through a real proxy with a real driver, because the claim is
# about bytes on a wire and a mock would only prove the mock was filtered.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Start Atlas Local (mongod + mongot)
        run: docker compose up -d --wait mongo

      - name: Start the three-node replica set
        # Fan-out is the one claim Atlas Local cannot test: it is a
        # single-node set, so every routing assertion against it would pass
        # by having nowhere else to send a read. This rig also enables
        # `configureFailPoint`, which is how replication lag gets *caused*
        # rather than waited for.
        run: docker compose up -d --wait rs

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Sync
        run: uv sync --all-extras

      - name: Lint
        run: uv run --no-sync ruff check voyd/ tools/ tests/ examples/ scanner/

      - name: Types, because the wheel ships py.typed
        # `voyd/py.typed` tells every downstream checker that these
        # annotations are load-bearing. That is a promise made in the
        # artifact, so it is checked here rather than trusted.
        run: uv run --no-sync mypy

      - name: The core needs no database
        # If this step ever needs `services:`, the boundary has stopped being
        # pure -- and a per-document check that cannot run without a database
        # is one that cannot move to a wire, a browser, or anywhere else.
        run: |
          uv run --no-sync pytest -q \
            tests/test_the_codec_round_trips.py \
            tests/test_the_boundary_refuses.py \
            tests/test_the_policy_file_is_the_configuration.py \
            tests/test_the_scanner_is_not_confidently_wrong.py \
            tests/test_the_server_owns_the_encoding.py \
            tests/test_the_policy_is_checked_against_the_cluster.py \
            -m 'not needs_mongo'

      - name: Fan-out, against three mongods and a real election
        # Kept as its own step because it is the only one that can fail for
        # a reason that is not VOYD's: if replication is instant on the
        # runner, the control assertion says so rather than letting the lag
        # test pass for the wrong reason.
        run: |
          uv run --no-sync pytest -q \
            tests/test_the_boundary_ranks_on_a_replica_and_asks_the_primary.py

      - name: The scanner runs on a machine with nothing installed
        # It is the first thing a stranger runs and the only thing here that
        # judges code nobody on this side has seen, so the claim that it
        # needs no install is tested by uninstalling everything: a bare
        # interpreter, no `uv sync`, no `pip install`, no PYTHONPATH.
        run: python3 scanner/voyd_scan --strict voyd/ tools/ scanner/

      - name: Importing voyd is the policy vocabulary and one driver
        run: |
          uv run --no-sync python -c "
          import sys, voyd
          assert 'Engine' in voyd.__all__ and 'guard' in voyd.__all__
          third = {m.split('.')[0] for m in sys.modules
                   if not m.startswith(('_', 'voyd'))} - sys.stdlib_module_names
          unexpected = third - {'pymongo', 'bson', 'gridfs', 'dns',
                                'pymongocrypt', 'cryptography'}
          assert not unexpected, f'importing voyd pulled {sorted(unexpected)}'
          print('clean:', sorted(voyd.__all__))"

      - name: The wheel builds and the cut surfaces stayed cut
        run: |
          uv build
          uv venv /tmp/wheelcheck
          VIRTUAL_ENV=/tmp/wheelcheck uv pip install dist/*.whl
          /tmp/wheelcheck/bin/python -c "
          import voyd
          from voyd import Engine, guard, deadline, revocable
          for gone in ('voyd.app', 'voyd.web', 'voyd.mcp', 'voyd.store',
                       'voyd.engine.ledger', 'voyd.engine.perimeter'):
              try:
                  __import__(gone)
              except ImportError:
                  continue
              raise AssertionError(f'{gone} is back in the wheel')
          print('wheel: the policy vocabulary imports, the cut stayed cut')"

      - name: End to end, real driver through a real boundary
        # Atlas Local is a real mongod and a real mongot, not a mock. The
        # server-side embedding test skips here and runs in the step below,
        # because Atlas Local registers no models -- it *declines* an
        # `auto_embed` declaration, and a test that accepted the fallback
        # would assert the opposite of what it claims.
        env:
          VOYD_TEST_MONGO_URI: mongodb://localhost:27018/?directConnection=true
        # `-m ""` clears the default deselection. The fast run is for a
        # laptop; CI is the place the index builds actually happen.
        run: uv run --no-sync pytest -q -m "" tests/

      - name: Server-side embedding, against a real Atlas cluster
        # The one claim that cannot be checked anywhere else. Gated on the
        # secret being present so a fork's CI is green rather than red for a
        # reason it cannot fix -- and skipped loudly rather than silently,
        # because `auto_embed` is a headline feature.
        if: ${{ env.VOYD_ATLAS_URI != '' }}
        env:
          VOYD_ATLAS_URI: ${{ secrets.VOYD_ATLAS_URI }}
        run: |
          uv run --no-sync pytest -q -rs \
            tests/test_search_refuses_on_the_path_that_bypasses_the_query.py

      - name: The examples are the documentation, so they have to run
        env:
          VOYD_MONGO_URI: mongodb://localhost:27018/?directConnection=true
        run: |
          for f in examples/*.py; do
            echo "--- $f"
            uv run --no-sync python "$f" > /dev/null || exit 1
          done

      - name: Mongo logs on failure
        if: failure()
        run: docker compose logs mongo | tail -100
