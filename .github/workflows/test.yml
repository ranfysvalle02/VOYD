name: test

# The claims that matter -- documents inheriting the scope's deadline, the void
# as a retrieval boundary, hybrid ranking, a cold index that cannot look empty
# -- are only true if the *queries* are right, so CI runs them against real
# mongot (Atlas Local), the same path a laptop uses. No mock tier, on purpose.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Start Atlas Local (mongod + mongot)
        # Only the database service. The `voyd` app service reads .env to boot;
        # the suite does not -- it talks to Mongo directly on 27018. `--wait`
        # blocks on the compose healthcheck, which waits for mongot
        # ($listSearchIndexes), not just for mongod to ping.
        #
        # The `cp` below is also the Quickstart's second line, and for a while
        # `.env.example` was neither tracked nor present -- so this step was
        # broken and so was every new user's first run.
        # `tests/test_the_documented_first_run_works.py` now fails if the file
        # goes missing again, or if a setting is added without documenting it.
        run: |
          cp .env.example .env
          docker compose up -d --wait mongo

      - name: Install uv + Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: crypt_shared, for the automatic-encryption path
        # pip cannot supply this: automatic encryption needs MongoDB's
        # query-analysis library, which is an Enterprise download. Without it
        # `tests/test_a_destroyed_key_is_the_stronger_erasure.py` and the
        # queryable-encryption tests skip -- loudly, but a skip that is
        # always a skip is a test nobody has ever run.
        #
        # Version-pinned rather than `latest`: this is a download, and a
        # silently-moving binary under a correctness test is how a CI run
        # starts meaning something different without anybody deciding.
        run: |
          curl -fsSL -o /tmp/crypt.tgz \
            "https://downloads.mongodb.com/linux/mongo_crypt_shared_v1-linux-x86_64-enterprise-ubuntu2204-8.0.13.tgz"
          mkdir -p /opt/mongo_crypt && tar -xzf /tmp/crypt.tgz -C /opt/mongo_crypt
          echo "CRYPT_SHARED_LIB_PATH=$(find /opt/mongo_crypt -name 'mongo_crypt_v1.so' | head -1)" >> "$GITHUB_ENV"

      - name: Sync (Engine + all extras + dev)
        run: uv sync --all-extras

      - name: An external key server is actually reachable
        # The suite skips the KMIP tests when pykmip is absent, and a skip
        # that is always a skip is a test nobody has ever run. This is the
        # one rung of the custody ladder that can be stood up without a
        # cloud account, so it is the one CI must not let slide.
        run: |
          uv run --no-sync python -c "
          import kmip
          from kmip.services.server import KmipServer
          print('pykmip available:', KmipServer.__name__)"

      - name: The encryption stack is actually present
        # Asserted rather than assumed, because the failure mode of the step
        # above is a skip, and a skipped correctness test looks exactly like
        # a passing one in a green run.
        run: |
          uv run --no-sync python -c "
          from voyd.engine.keyring import available
          ok, why = available()
          assert ok, f'automatic encryption unavailable in CI: {why}'
          print('crypto:', why)"

      - name: A real policy engine is actually installed
        # `tests/test_a_policy_engine_owns_the_subject_not_the_objects.py`
        # compares a compiled VOYD policy against a live `casbin.Enforcer`,
        # and skips without one -- and a skip that is always a skip is a test
        # nobody has ever run. This is the same argument as the pykmip step
        # above: the claim is about the real thing, so CI must have it.
        run: |
          uv run --no-sync python -c "
          import casbin
          print('casbin available:', casbin.Enforcer.__name__)"

      - name: Lint
        # [tool.ruff] was configured for a long time and ruff was not a
        # declared dependency, and CI never ran it -- so the rules held only
        # on a machine that happened to have the tool. Fast, and it goes
        # before the 4-minute test job so a style failure is not discovered
        # last.
        run: uv run --no-sync ruff check voyd/ tests/ examples/ bench/ drift/

      - name: Types, because the wheel ships py.typed
        # `voyd/py.typed` tells every downstream type checker that these
        # annotations are load-bearing -- a promise made in the artifact and,
        # until this step, verified nowhere. mypy was not even a declared
        # dependency, so the honest state was that nobody had run it.
        #
        # The first run that did found 268 errors. Two causes accounted for
        # 220 of them and neither was a bug: the six admission mixins are
        # composed onto one class, so each one read in isolation appeared to
        # use attributes it does not define (now stated in
        # `admission/composition.py`), and `MongoStore` is two-phase, so
        # everything hanging off `connect()` was typed `None` (now behind
        # `_engine`). The rest were real if small, including a protocol no
        # rule in the package satisfied and an `AttributeError` waiting in a
        # search-degradation log line.
        #
        # It is clean now, and this step is what stops it drifting back --
        # the same argument the ruff step above makes about itself.
        run: uv run --no-sync mypy

      - name: Engine installs on its own
        # Move #1 of this repo is "Engine is what you install." Prove the import
        # graph in the built package: Engine, no FastAPI. This does not need Mongo.
        run: |
          uv run --no-sync python -c "import sys; from voyd import Engine, PermanentFailure; \
            assert 'fastapi' not in sys.modules, 'importing Engine pulled the Host'; \
            print('Engine imports clean:', Engine.__name__)"

      - name: The wheel builds, and the claim holds *in the wheel*
        # The step above proves the import graph in the source tree, which is
        # not the thing anybody installs. That gap hid a real bug: a
        # force-include duplicated every theme file at the same archive path,
        # so `uv build --wheel` failed outright and `pip install voyd` had
        # never worked. Nothing caught it, because nothing built the artifact.
        #
        # So: build it, install it alone in a clean venv, and re-assert the
        # engine-only contract against what a stranger would actually get.
        run: |
          uv build
          uv venv /tmp/wheelcheck
          VIRTUAL_ENV=/tmp/wheelcheck uv pip install dist/*.whl
          /tmp/wheelcheck/bin/python -c "
          import sys
          from voyd import Engine, PermanentFailure
          assert 'fastapi' not in sys.modules, 'the wheel pulls FastAPI'
          try:
              import fastapi
              raise AssertionError('bare wheel install dragged in the app extra')
          except ImportError:
              pass
          print('wheel: Engine imports clean, no FastAPI')"
          VIRTUAL_ENV=/tmp/wheelcheck uv pip install "voyd[app] @ ./dist/$(ls dist | grep whl)"
          /tmp/wheelcheck/bin/python -c "
          import voyd.app
          from voyd.web import owner, vault
          paths = {r.path for r in vault.router.routes} | {r.path for r in owner.router.routes}
          for needed in ('/v1/voids', '/v1/voids/{token}/forget', '/v1/owners'):
              assert needed in paths, f'{needed} missing from the built wheel: {sorted(paths)}'
          print('wheel[app]: service imports and the API surface is intact')"

      - name: voyd-scan installs with nothing, because that is its whole claim
        # `scanner/` is a second distribution and the first thing a stranger
        # runs. Its pitch is that it costs them nothing -- no database, no
        # credentials, and above all no `pymongo` arriving as a dependency of
        # a tool that is only supposed to read their source. That is a claim
        # a build can falsify, so it does.
        #
        # The import check is the load-bearing half. A dependency-free
        # `pyproject.toml` proves nothing if the module reaches for `voyd`
        # at runtime: the number this prints has to be independent of the
        # library it makes a case for, or it is not evidence.
        run: |
          uv build --wheel scanner --out-dir dist-scanner
          uv venv /tmp/scancheck
          VIRTUAL_ENV=/tmp/scancheck uv pip install dist-scanner/*.whl
          /tmp/scancheck/bin/python -c "
          import sys, voyd_scan
          for forbidden in ('pymongo', 'bson', 'voyd'):
              assert forbidden not in sys.modules, f'voyd-scan imported {forbidden}'
          print('voyd-scan: imports clean, no driver, no voyd')"
          mkdir -p /tmp/scandemo
          printf 'def f(db):\n    db.n.insert_one({\"expire_at\": 1})\n    return db.n.find({})\n' > /tmp/scandemo/s.py
          # `run:` is `bash -e`, and both invocations below are *expected* to
          # exit non-zero -- that is the assertion. So each one captures its
          # status with `|| rc=$?` rather than being allowed to abort the step.
          rc=0; /tmp/scancheck/bin/voyd-scan /tmp/scandemo || rc=$?
          test "$rc" -ne 0 || { echo "FAIL: a repo with a leak exited 0"; exit 1; }
          rc=0; /tmp/scancheck/bin/voyd-scan /tmp/nope || rc=$?
          test "$rc" -eq 255 || { echo "FAIL: a missing path exited $rc, not 255"; exit 1; }
          echo "voyd-scan: finds the leak, and refuses to bless a path that is not there"

      - name: No agent tool can leave a cleanup obligation
        # The pitch is that a scope collects itself. An agent that has to
        # remember to clean up is the failure this exists to remove.
        #
        # This gate used to assert an exact set of four tool names, which was
        # the wrong invariant: it froze the surface instead of protecting the
        # property, so adding `forget` -- a tool that hands the agent no
        # obligation at all -- looked like a violation when it is the
        # principle being honoured. The rule is about what a tool *promises*,
        # not how many there are.
        run: |
          uv run --no-sync python -c "
          import asyncio
          from voyd.mcp import build_server
          class Stub:
              def __getattr__(self, n): raise AssertionError('no network in CI')
          names = {t.name for t in asyncio.run(build_server(Stub()).list_tools())}
          banned = {'delete', 'remove', 'destroy', 'purge', 'drop', 'cleanup',
                    'expire', 'gc', 'collect'}
          leaked = names & banned
          assert not leaked, f'a cleanup obligation reached the agent: {leaked}'
          assert 'forget' in names, 'forgetting must be reachable by an agent'
          print('MCP surface:', sorted(names), '-- no delete, forget present')"

      - name: Test
        env:
          # Explicit even though it is the default: mongot index builds are async,
          # and the suite polls up to ~60s per ensure() rather than sleeping.
          VOYD_TEST_MONGO_URI: mongodb://localhost:27018/?directConnection=true
        run: uv run --no-sync pytest -q

      - name: Mongo logs on failure
        if: failure()
        run: docker compose logs mongo | tail -100
