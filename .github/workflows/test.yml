name: test

# Small on purpose. The suite is the foundation the rewrite stands on, not a
# census. Four of its five files need no database at all -- the per-document
# check, the policy loader and the wire codec are pure, which is what lets
# the same check run inside a proxy in the first place. The fifth drives a
# real `mongod` through a real proxy with a real driver, because its claims
# are about queries and bytes and a mock would only prove the mock was
# filtered.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Start Atlas Local (mongod + mongot)
        run: docker compose up -d --wait mongo

      - name: Start the three-node replica set
        # Fan-out is the one claim Atlas Local cannot test: it is a
        # single-node set, so every routing assertion against it would pass
        # by having nowhere else to send a read. This rig also enables
        # `configureFailPoint`, which is how replication lag gets *caused*
        # rather than waited for.
        run: docker compose up -d --wait rs

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Sync
        run: uv sync --all-extras

      - name: Lint
        run: uv run --no-sync ruff check voyd/ tests/ examples/ scanner/

      - name: Types, because the wheel ships py.typed
        # `voyd/py.typed` tells every downstream checker that these
        # annotations are load-bearing. That is a promise made in the
        # artifact, so it is checked here rather than trusted.
        run: uv run --no-sync mypy

      - name: The core needs no database
        # If this step ever needs `services:`, the boundary has stopped being
        # pure -- and a per-document check that cannot run without a database
        # is one that cannot move to a wire, a browser, or anywhere else.
        #
        # Selected by marker rather than by filename, so a new pure file is
        # covered the moment it is written and a new *impure* one has to
        # declare itself `needs_mongo` to be skipped here. A list of paths
        # silently stops covering whatever was added after it.
        run: |
          uv run --no-sync pytest -q -m 'not needs_mongo'

      - name: The container is the deployment story, so it is built and run
        # The deployment path is a claim like any other and gets the same
        # treatment. It builds, it runs as a non-root uid, it answers
        # --version, and its HEALTHCHECK command fails when there is
        # nothing to be healthy about.
        run: |
          docker build -t voyd:ci .
          test "$(docker run --rm --entrypoint id -u voyd:ci)" != "0"
          docker run --rm voyd:ci --version
          docker run --rm --entrypoint voyd-wire-health voyd:ci --port 1 \
            && { echo "health passed with nothing listening"; exit 1; } \
            || echo "health correctly failed"
          # And it serves: a sidecar-shaped run, a client on the container's
          # own loopback, an expired row refused and a delete become a
          # revocation with every row still on disk.
          docker run -d --name voyd-ci --network host voyd:ci \
            --config voydfile.py --listen 27099 --metrics 27100 \
            --target 127.0.0.1:27018
          for _ in $(seq 30); do
            docker exec voyd-ci voyd-wire-health && break || sleep 1
          done
          docker exec voyd-ci voyd-wire-health
          docker rm -f voyd-ci

      - name: The scanner runs on a machine with nothing installed
        # It is the first thing a stranger runs and the only thing here that
        # judges code nobody on this side has seen, so the claim that it
        # needs no install is tested by uninstalling everything: a bare
        # interpreter, no `uv sync`, no `pip install`, no PYTHONPATH.
        run: python3 scanner/voyd_scan --strict voyd/ scanner/

      - name: Importing voyd is the policy vocabulary and one driver
        run: |
          uv run --no-sync python -c "
          import sys, voyd
          assert 'guard' in voyd.__all__ and 'Engine' not in voyd.__all__
          third = {m.split('.')[0] for m in sys.modules
                   if not m.startswith(('_', 'voyd'))} - sys.stdlib_module_names
          unexpected = third - {'pymongo', 'bson', 'gridfs', 'dns',
                                'pymongocrypt', 'cryptography'}
          assert not unexpected, f'importing voyd pulled {sorted(unexpected)}'
          print('clean:', sorted(voyd.__all__))"

      - name: The wheel builds, ships the proxy, and exposes no handle
        run: |
          uv build
          uv venv /tmp/wheelcheck
          VIRTUAL_ENV=/tmp/wheelcheck uv pip install dist/*.whl
          /tmp/wheelcheck/bin/python -c "
          import voyd, voyd.engine
          from voyd import guard, deadline, revocable
          # There is one way to use this and it is not an import. An
          # application-facing handle re-exported from either module would
          # be a second door onto the guarantee, added silently, and a
          # wheel built from a dirty tree is where that would show up.
          for name in ('Engine', 'Model'):
              assert not hasattr(voyd, name), f'voyd.{name} is in the wheel'
              assert not hasattr(voyd.engine, name), f'voyd.engine.{name} is in the wheel'
          # And the product is *in* the wheel. The other half of the same
          # assertion: a distribution shipping the vocabulary to write a
          # policy and nothing that can serve one is not the artifact.
          import voyd.wire, voyd.wire.proxy, voyd.wire.seal, voyd.wire.cascade
          assert callable(voyd.wire.proxy.main)
          print('wheel: the policy vocabulary imports, the proxy ships')"
          test -x /tmp/wheelcheck/bin/voyd-wire
          /tmp/wheelcheck/bin/voyd-wire --help > /dev/null

      - name: End to end, real driver through a real boundary
        # Atlas Local is a real mongod and a real mongot, not a mock.
        #
        # `-m ""` clears the default deselection, and the one `slow` test it
        # lets in skips by name here: server-side embedding needs a cluster
        # that has registered a model, and Atlas Local *declines* an
        # `auto_embed` declaration rather than honouring it. A run that
        # accepted the fallback would assert the opposite of what it claims.
        # Set VOYD_ATLAS_URI to have it actually run.
        env:
          VOYD_TEST_MONGO_URI: mongodb://localhost:27018/?directConnection=true
        run: uv run --no-sync pytest -q -rs -m "" tests/

      - name: The examples are the documentation, so they have to run
        env:
          VOYD_MONGO_URI: mongodb://localhost:27018/?directConnection=true
        run: |
          for f in examples/*.py; do
            echo "--- $f"
            uv run --no-sync python "$f" > /dev/null || exit 1
          done

      - name: Mongo logs on failure
        if: failure()
        run: docker compose logs mongo | tail -100
