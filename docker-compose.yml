services:
  mongo:
    # Atlas Local: a real single-node Atlas deployment -- mongod + mongot in one
    # container. This is deliberately not `mongo:7`. VOYD's search, GC and TTL
    # behaviour all depend on Atlas features, so developing against a plain
    # mongod meant the default experience silently exercised fallback paths and
    # never ran $vectorSearch at all.
    #
    # Gives us, with no Atlas account and no network:
    #   $vectorSearch + $search   (mongot, bundled)
    #   $rankFusion               (8.1+, hybrid search)
    #   change streams w/ pre-images, TTL  (it is a replica set out of the box)
    image: mongodb/mongodb-atlas-local:8.2
    container_name: voyd-mongo
    ports:
      - "27018:27017"
    volumes:
      - voyd-atlas:/data/db
    healthcheck:
      # Not just "is mongod up" -- wait until mongot answers, because that is
      # what the app blocks on at startup while search indexes build.
      test:
        - CMD-SHELL
        - mongosh --quiet --eval 'db.getSiblingDB("admin").aggregate([{$listSearchIndexes:{}}])' >/dev/null 2>&1 || mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' | grep -q 1
      interval: 5s
      timeout: 10s
      retries: 40
      start_period: 20s


  # A real three-node replica set, for the one claim Atlas Local cannot test.
  #
  # Atlas Local runs without `--auth`, so every caller-identity assertion
  # against it would pass by having nobody to identify. That is the shape
  # of test this repository exists to distrust.
  #
  # All three mongods live in *one* container on 27021-27023, which is the
  # only arrangement where the member hostnames work from both sides: peers
  # reach each other over the container's own loopback, and the proxy --
  # running on the host, outside Docker -- reaches the same `localhost:PORT`
  # strings through the published ports. Split across three services, the
  # replica set config would have to name either container DNS (unreachable
  # from the host) or published ports (unreachable from a peer), and the
  # boundary would be handed member addresses it cannot dial.
  #
  # Plain `mongo:8`, not Atlas Local: this rig exists to test routing and
  # replication lag, and needs no mongot.
  rs:
    image: mongo:8
    container_name: voyd-rs
    ports:
      - "27021:27021"
      - "27022:27022"
      - "27023:27023"
    command:
      - bash
      - -c
      - |
        set -e
        # Internal auth needs a shared key, and turning `--auth` on is not
        # a detail of the rig: the boundary asks the *server* who
        # authenticated, and a deployment where nobody did answers every
        # caller-aware rule the same way.
        openssl rand -base64 756 > /data/keyfile
        chmod 400 /data/keyfile
        chown mongodb /data/keyfile || true
        for p in 27021 27022 27023; do
          mkdir -p /data/rs$$p
          # `enableTestCommands` is what makes `configureFailPoint`
          # available, and that is the whole reason this rig exists rather
          # than a second Atlas Local: replication lag has to be *caused*
          # on demand, not waited for. The same argument the failover test
          # makes with `replSetStepDown` -- an outage you cannot cause is
          # one you are reasoning about instead of measuring. Test-only,
          # never a flag for a real deployment.
          mongod --replSet voydrs --port $$p --dbpath /data/rs$$p \
                 --bind_ip_all --oplogSize 128 --fork \
                 --keyFile /data/keyfile \
                 --setParameter enableTestCommands=1 \
                 --logpath /data/rs$$p/mongod.log
        done
        # The localhost exception lets exactly one thing happen before a
        # user exists: create the first user. Both steps run unauthenticated
        # and everything after them does not.
        mongosh --quiet --port 27021 --eval '
          try { rs.status() } catch (e) {
            rs.initiate({_id: "voydrs", members: [
              {_id: 0, host: "localhost:27021", priority: 10},
              {_id: 1, host: "localhost:27022", priority: 1},
              {_id: 2, host: "localhost:27023", priority: 1}]})
          }'
        until mongosh --quiet --port 27021 --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; do sleep 1; done
        mongosh --quiet --port 27021 --eval '
          try {
            db.getSiblingDB("admin").createUser({user: "voyd", pwd: "voyd",
              roles: [{role: "root", db: "admin"}]})
          } catch (e) { if (!/already exists/.test(e.message)) throw e }'
        # A second identity, and the reason it exists: a caller-aware rule
        # is only tested by two callers. One user proves the boundary can
        # read an identity; two prove it reads the *right* one. Created
        # authenticated, because the localhost exception covers only the
        # first user on a deployment.
        mongosh --quiet --port 27021 -u voyd -p voyd --authenticationDatabase admin --eval '
          try {
            db.getSiblingDB("admin").createUser({user: "someone-else",
              pwd: "someone-else", roles: [{role: "readWriteAnyDatabase", db: "admin"}]})
          } catch (e) { if (!/already exists/.test(e.message)) throw e }
          // A third identity with the *same name* as the first, in a
          // different auth database. admin.voyd and elsewhere.voyd are two
          // principals, and an identity check comparing only usernames
          // would hand one of them the other connection. That hole was
          // real for one commit; this is what keeps it closed.
          try {
            db.getSiblingDB("elsewhere").createUser({user: "voyd",
              pwd: "voyd", roles: [{role: "readWrite", db: "elsewhere"}]})
          } catch (e) { if (!/already exists/.test(e.message)) throw e }'
        # Hold the container open; the mongods are forked into the background.
        tail -f /data/rs27021/mongod.log
    healthcheck:
      # Not "is mongod up" but "is there a primary and are both secondaries
      # reporting" -- a test that starts before the set has elected is
      # flaky in a way that looks like a defect in the boundary.
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --port 27021 -u voyd -p voyd --authenticationDatabase admin --eval
          'quit(rs.status().members.filter(m => m.stateStr == "PRIMARY").length == 1
           && rs.status().members.filter(m => m.stateStr == "SECONDARY").length == 2 ? 0 : 1)'
      interval: 5s
      timeout: 10s
      retries: 40
      start_period: 10s


volumes:
  # Declared because it is referenced above. Without this stanza `docker
  # compose up` fails with "invalid compose project" and never starts
  # mongod -- which took the integration half of CI with it, silently, for
  # as long as nobody read past the first failing line.
  voyd-atlas:
