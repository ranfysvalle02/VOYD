# The four owners, as four real services.
#
# This is the stack the README's table describes: Postgres owns the metadata
# row, Qdrant owns the vector, S3-compatible storage owns the bytes, and a
# cron job is supposed to keep them agreeing. It exists so the drift argument
# can be *run* instead of asserted.
#
#   docker compose -f drift/docker-compose.drift.yml up -d --wait
#   uv run --extra drift python drift/exhibit.py
#   docker compose -f drift/docker-compose.drift.yml down -v
#
# Deliberately separate from the project's own docker-compose.yml: nothing
# VOYD ships needs any of this, and the main quickstart must not grow three
# services to make a rhetorical point.

services:
  drift-postgres:
    # pgvector's image, not plain postgres:16 -- a superset, so `exhibit.py`
    # is unaffected, and `refusal_on_postgres.py` needs a real vector index
    # to make its point. Arguing about retrieval against a stack with no
    # vector search would be arguing against a straw man.
    image: pgvector/pgvector:pg16
    container_name: drift-postgres
    environment:
      POSTGRES_PASSWORD: drift
      POSTGRES_USER: drift
      POSTGRES_DB: drift
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drift -d drift"]
      interval: 3s
      timeout: 5s
      retries: 20

  drift-qdrant:
    image: qdrant/qdrant:latest
    container_name: drift-qdrant
    ports:
      - "56333:6333"
    healthcheck:
      # Qdrant's image has no curl/wget; use its own bundled entrypoint binary
      # to answer whether the HTTP port is serving.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 3s
      timeout: 5s
      retries: 20

  drift-minio:
    # quay.io, not docker.io/minio/minio: the Docker Hub repository now
    # refuses anonymous pulls ("pull access denied"). Same image, reachable.
    image: quay.io/minio/minio:latest
    container_name: drift-minio
    command: server /data
    environment:
      MINIO_ROOT_USER: driftkey
      MINIO_ROOT_PASSWORD: driftsecret
    ports:
      - "59000:9000"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 30
