[project]
name = "voyd"
version = "0.1.0"
description = "Ranking is not permission. A retrieval read path that cannot return a fact it has forgotten -- admission control for what may reach a prompt."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Fabian Valle" }]
requires-python = ">=3.11"
keywords = [
    "mongodb", "vector-search", "retrieval", "rag", "admission-control",
    "ttl", "expiry", "erasure", "audit-log",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# The body is Engine. `import voyd` / `from voyd import Engine` needs only a
# MongoDB driver -- everything else is an extra you opt into.
dependencies = [
    "pymongo>=4.9",            # async: from pymongo import AsyncMongoClient (NO motor)
]

[project.optional-dependencies]
# Embeddings. `remember()` takes floats; this is only for computing them.
voyage = [
    "voyageai>=0.3.2",
]
# Cryptographic erasure. The deadline destroys the key, so the ciphertext is
# unreadable in every copy -- replicas, snapshots, the backup nobody has
# restored yet -- which is the one question refusal cannot answer.
#
# Note what pip cannot give you: *automatic* encryption also needs
# `crypt_shared` (or mongocryptd), which is a MongoDB Enterprise download and
# not on PyPI. `voyd.engine.keyring.available()` says which half is missing,
# and every read path works without either -- refusal does not depend on this.
crypto = [
    "pymongo[encryption]>=4.9",
]
# Everything optional: embeddings + cryptographic erasure.
all = [
    "voyd[voyage,crypto]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    # Configured in [tool.ruff] below and run in CI. It was configured and
    # *not* declared for a while, which made the lint rules advisory: they
    # held only on a machine that happened to have the tool. A rule you have
    # to remember to run is a suggestion, which is this project's whole
    # complaint about conventions.
    "ruff>=0.5",   # rule set is pinned in [tool.ruff.lint], so the tool may float
    # `tests/test_every_documented_command_is_real.py` reads the compose files
    # to check that a documented `docker compose up -d --wait <service>` names
    # a service that exists. It arrives transitively today (uvicorn[standard]),
    # which is exactly how `ruff` and `mypy` were undeclared above -- a tool
    # the suite depends on, present by luck, until the day a transitive
    # dependency drops it and a test that was never about YAML fails on an
    # import. Declared, so the suite owns what it uses.
    "pyyaml>=6.0",
    # The package ships `py.typed`, which tells every downstream type checker
    # that these annotations are load-bearing. That promise was made in the
    # wheel and checked nowhere -- the same failure the ruff comment above
    # describes, one level worse: an undeclared linter is advisory, but an
    # unchecked `py.typed` is a claim other people's builds act on.
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/ranfysvalle02/VOYD"
Source = "https://github.com/ranfysvalle02/VOYD"
Issues = "https://github.com/ranfysvalle02/VOYD/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voyd"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Selected explicitly, not inherited. Leaving this out means the rule set is
# whatever the installed ruff currently defaults to -- and that moves: the
# same code linted clean under 0.5 and produced 115 findings under 0.16,
# without a line changing. A build that changes under you is the thing this
# codebase pins settings to avoid everywhere else (see `Engine`, which fixes
# its own clock and codecs rather than inheriting the caller's client).
#
# This is the historical default -- pyflakes plus the pycodestyle errors that
# are actually errors -- and adding a rule should be a deliberate commit that
# also fixes what it finds.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Every test that touches an optional extra guards its imports with
# ``pytest.importorskip`` *before* importing, so an engine-only install skips
# the test instead of failing collection. That ordering is the point, and it is
# E402 by construction.
"tests/*" = ["E402"]

[tool.mypy]
files = ["voyd"]
# No `python_version` pin, deliberately. Pinning it to the 3.11 floor makes
# mypy read every installed stub under 3.11 syntax, and a dependency resolved
# for the 3.12 interpreter in this venv (numpy, via `voyageai`) then fails to
# *parse* -- which is fatal, so the run dies before checking a line of `voyd`.
# Letting mypy follow the interpreter means CI, which installs 3.11, checks
# the floor against a 3.11 dependency set, and a 3.12 laptop checks 3.12.
# Both are real configurations; the pinned pair was not.
# Deliberately not `strict`. Strict on a codebase this size produces a number
# nobody acts on, and a check nobody acts on is the thing this repository
# complains about everywhere else. These are the rules that catch the errors
# `py.typed` makes downstream users trust us about: a signature that lies, a
# None that is not declared, an annotation that silently means `Any`.
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true

# Third parties without stubs. Listed one by one rather than with a blanket
# `ignore_missing_imports = true`, so adding a dependency that *does* ship
# types cannot quietly land untyped.
[[tool.mypy.overrides]]
module = ["voyageai.*", "pymongocrypt.*"]
ignore_missing_imports = true

# `voyd` imports no numpy; it arrives because `voyageai` ships `py.typed`, so
# mypy walks into it and on into numpy's stubs -- which use 3.12 `type`
# statements and are a syntax error under the 3.11 floor pinned above, killing
# the run before any of our own code is checked. Stopping at the extra's edge
# keeps the floor honest, which is the point of pinning it.
[[tool.mypy.overrides]]
module = ["voyageai.*", "numpy.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
# `scanner` is a second distribution with no dependencies and no import of
# `voyd`; putting it on the path is what lets a test reach it without the
# two packages depending on each other.
pythonpath = [".", "scanner", "tools"]

[dependency-groups]
dev = [
    "pytest-xdist>=3.6",
]
