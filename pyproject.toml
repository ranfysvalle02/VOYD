[project]
name = "voyd"
version = "0.1.0"
description = "Ranking is not permission. A MongoDB wire proxy that cannot serve a fact it has forgotten -- admission control for what may reach a prompt, in one policy file and one connection string."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Fabian Valle" }]
requires-python = ">=3.11"
keywords = [
    "mongodb", "vector-search", "retrieval", "rag", "admission-control",
    "ttl", "expiry", "erasure", "audit-log", "proxy", "wire-protocol",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# The body is the proxy. `import voyd` is the policy vocabulary a
# `voydfile.py` needs and nothing else, and it needs only a MongoDB driver
# -- everything else is an extra you opt into.
dependencies = [
    "pymongo>=4.9",            # async: from pymongo import AsyncMongoClient (NO motor)
]

[project.optional-dependencies]
# Cryptographic erasure. The deadline destroys the key, so the ciphertext is
# unreadable in every copy -- replicas, snapshots, the backup nobody has
# restored yet -- which is the one question refusal cannot answer.
#
# Note what pip cannot give you: *automatic* encryption also needs
# `crypt_shared` (or mongocryptd), which is a MongoDB Enterprise download and
# not on PyPI. `voyd.engine.keyring.available()` says which half is missing,
# and every read path works without either -- refusal does not depend on this.
crypto = [
    "pymongo[encryption]>=4.9",
]
# Everything optional, which is one thing. Nothing here computes an
# embedding: `auto_embed` means the index owns the vector and the server
# produces it, so a client-side embedding library is not a dependency this
# package has an opinion about.
all = [
    "voyd[crypto]",
]
# Every tool the suite and CI actually invoke, declared rather than inherited.
# A linter or type checker that arrives transitively is advisory -- it holds
# only on a machine that happens to have it -- and a rule you have to
# remember to run is a suggestion, which is this project's whole complaint
# about conventions. `py.typed` makes it worse than advisory: it is a promise
# other people's builds act on, so the checker that keeps it has to be here.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",   # rule set is pinned in [tool.ruff.lint], so the tool may float
    "mypy>=1.11",
    "pyyaml>=6.0", # tests/test_every_documented_command_is_real.py reads the compose file
]

[project.urls]
Homepage = "https://github.com/ranfysvalle02/VOYD"
Source = "https://github.com/ranfysvalle02/VOYD"
Issues = "https://github.com/ranfysvalle02/VOYD/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
# The artifact. `pip install voyd` has to give you something that can
# serve a policy file, not only the vocabulary to write one.
voyd-wire = "voyd.wire.cli:main"
voyd-bench = "voyd.wire.bench:main"
voyd-wire-health = "voyd.wire.health:main"

[tool.hatch.build.targets.wheel]
packages = ["voyd"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Selected explicitly, not inherited. Leaving this out makes the rule set
# whatever the installed ruff currently defaults to, and that moves: the same
# code lints clean under 0.5 and produces 115 findings under 0.16 without a
# line changing. A build that changes under you is what this codebase pins
# settings to avoid everywhere else -- `voyd-wire` fixes its own clock and
# codecs rather than inheriting the caller's, for the same reason.
#
# This is pyflakes plus the pycodestyle errors that are actually errors.
# Adding a rule should be a deliberate commit that also fixes what it finds.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Every test that touches an optional extra guards its imports with
# ``pytest.importorskip`` *before* importing, so an engine-only install skips
# the test instead of failing collection. That ordering is the point, and it is
# E402 by construction.
"tests/*" = ["E402"]

[tool.mypy]
# Everything this repository ships or runs, the boundary included -- the
# concurrency, the failover and the byte-level protocol rewriting are the
# hardest code here and so the least safe to leave unchecked.
#
# `scanner` is included because it ships as its own distribution and judges
# somebody else's repository, which is the one piece of this project that
# runs against code nobody here has seen.
files = ["voyd", "scanner/voyd_scan"]
# No `python_version` pin, deliberately. Pinning it to the 3.11 floor makes
# mypy read every installed stub under 3.11 syntax, so a dependency resolved
# for a newer interpreter can fail to *parse* -- which is fatal, and kills
# the run before it checks a line of `voyd`. Letting mypy follow the
# interpreter means CI, which installs 3.11, checks the floor against a 3.11
# dependency set, and a 3.12 laptop checks 3.12. Both are real
# configurations; the pinned pair is not.
#
# Deliberately not `strict`, either. Strict on a codebase this size produces
# a number nobody acts on, and a check nobody acts on is the thing this
# repository complains about everywhere else. These are the rules that catch
# the errors `py.typed` makes downstream users trust us about: a signature
# that lies, a None that is not declared, an annotation that silently means
# `Any`.
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true

# Third parties without stubs. Listed one by one rather than with a blanket
# `ignore_missing_imports = true`, so adding a dependency that *does* ship
# types cannot quietly land untyped. `warn_unused_configs` above is what
# keeps this list honest when a dependency goes away.
[[tool.mypy.overrides]]
module = ["pymongocrypt.*", "snappy.*", "zstandard.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# The engine is async; `auto` means a test does not have to say so twice.
asyncio_mode = "auto"
testpaths = ["tests"]
# `pytest` is the inner loop at ~110 seconds. What `slow` excludes needs a
# real search index to build -- 90 seconds more on an idle laptop, minutes on
# a busy one, and it is the cluster's clock rather than ours.
#
# CI runs `-m ""` to include them, and a test asserts that it does, so
# "fast by default" cannot quietly become "never".
addopts = "-m 'not slow'"
markers = [
    "slow: needs a real search index to build, or a live Atlas cluster",
    # Applied only where a file is *mixed*, so the "core needs no database"
    # CI step can name files that are mostly pure. The alternative is a `-k`
    # expression matching test names, which silently stops matching when a
    # test is renamed.
    "needs_mongo: drives a real mongod through a real proxy",
]
# `scanner` is a second distribution with no dependencies and no import of
# `voyd`; putting it on the path is what lets a test reach it without the
# two packages depending on each other.
pythonpath = [".", "scanner"]
