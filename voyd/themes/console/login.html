{% extends "console/base.html" %}
{% block title %}Sign in · VOYD{% endblock %}

{% block content %}
<section class="stage stage-tight">
  <div class="shell auth-shell">
    <div class="panel">
      <h1 class="panel-title">Sign in</h1>
      <p class="dim">Welcome back.</p>

      {% if error %}<div class="alert">{{ error }}</div>{% endif %}

      <form class="stack" method="post" action="/login">
        <label>Email
          <input name="email" type="email" required autocomplete="email"
                 value="{{ email or '' }}" placeholder="you@example.com" />
        </label>
        <label>Password
          <input name="password" type="password" required
                 autocomplete="current-password" placeholder="Your password" />
        </label>
        <button class="btn btn-lg" type="submit">Sign in</button>
      </form>

      {% if not closed %}
      <p class="dim small">New here? <a class="tint" href="/signup">Create an account</a></p>
      {% endif %}
    </div>
  </div>
</section>
{% endblock %}
