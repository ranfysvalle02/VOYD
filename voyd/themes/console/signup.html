{% extends "console/base.html" %}
{% block title %}Create your account · VOYD{% endblock %}

{% block content %}
<section class="stage stage-tight">
  <div class="shell auth-shell">
    <div class="panel">
      <h1 class="panel-title">Create your account</h1>
      <p class="dim">One account, as many voyds as you want.</p>

      {% if error %}<div class="alert">{{ error }}</div>{% endif %}

      <form class="stack" method="post" action="/signup">
        <label>Email
          <input name="email" type="email" required autocomplete="email"
                 value="{{ email or '' }}" placeholder="you@example.com" />
        </label>
        <label>Password
          <input name="password" type="password" required minlength="8"
                 autocomplete="new-password" placeholder="At least 8 characters" />
        </label>
        <button class="btn btn-lg" type="submit">Create account</button>
      </form>

      <p class="dim small">Already have an account? <a class="tint" href="/login">Sign in</a></p>
    </div>
  </div>
</section>
{% endblock %}
